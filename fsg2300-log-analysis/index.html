<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSG2300 Log Analysis</title>
  <style>
    :root {
      color-scheme: light;
      --top: #f5f7fa;
      --info: #dce6f5;
      --tab: #ebebeb;
      --line: #b9c4d1;
      --grid: #e5eaf0;
      --text: #20242a;
      --muted: #505a66;
      --blue: #0072c6;
      --g1: #0072bd;
      --g2: #2fa84f;
      --c3: #d95319;
      --purple: #503c8c;
      --orange: #b45014;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    button, input, select, textarea { font: inherit; }
    .app { height: 100vh; display: grid; grid-template-rows: 58px 24px minmax(0, 1fr); }
    .topbar {
      position: relative;
      height: 58px;
      padding: 8px 6px 4px;
      background: var(--top);
      border-bottom: 1px solid #d5dde7;
      overflow: hidden;
    }
    .mainbtn {
      position: absolute;
      top: 8px;
      width: 138px;
      height: 42px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18);
    }
    #btnBatch { left: 6px; background: #0066cc; }
    #btnWafer { left: 151px; background: #008c46; }
    #btnPPT { left: 300px; background: #b45014; }
    #btnPPT:disabled { filter: grayscale(.7); opacity: .55; cursor: not-allowed; }
    .langbtn {
      position: absolute;
      top: 14px;
      width: 58px;
      height: 26px;
      border: 1px solid #a8b4c2;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .langbtn.active { background: #0072c6; border-color: #0072c6; color: #fff; }
    #btnLangZhTW { left: 444px; }
    #btnLangZhCN { left: 506px; }
    #btnLangEn { left: 568px; }
    #btnAbout {
      position: absolute;
      left: 630px;
      top: 14px;
      width: 28px;
      height: 26px;
      border: 1px solid #788caa;
      border-radius: 3px;
      background: #c8d2e1;
      color: #323250;
      font-weight: 900;
      cursor: pointer;
    }
    #lblPath {
      position: absolute;
      left: 662px;
      right: 104px;
      top: 14px;
      height: 30px;
      display: flex;
      align-items: center;
      color: #505050;
      font: 13px Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #lblVersion {
      position: absolute;
      right: 12px;
      top: 18px;
      width: 80px;
      height: 20px;
      color: #828ca0;
      text-align: right;
      font: 12px Consolas, monospace;
    }
    .info {
      height: 24px;
      display: flex;
      align-items: center;
      padding-left: 6px;
      background: var(--info);
      font: 13px Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tabs {
      height: 100%;
      display: grid;
      grid-template-rows: 31px minmax(0, 1fr);
      min-width: 0;
      background: #fff;
    }
    .tabstrip {
      display: flex;
      align-items: end;
      gap: 0;
      padding: 6px 4px 0;
      border-bottom: 1px solid #8fa4bd;
      background: #f4f4f4;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .tab {
      width: 95px;
      height: 24px;
      flex: 0 0 95px;
      border: 1px solid #aaa;
      border-bottom: 0;
      background: var(--tab);
      color: #222;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active {
      background: var(--blue);
      color: #fff;
      border-color: #0065ad;
    }
    .page { display: none; height: 100%; min-height: 0; overflow: hidden; }
    .page.active { display: block; }
    .fill { width: 100%; height: 100%; }
    .split-v { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) 172px; }
    .split-half { height: 100%; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .split-half > * + * { border-top: 1px solid #c8d0da; }
    .ctrlbar {
      height: 36px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 6px;
      background: #f0f3f8;
      border-bottom: 1px solid #d3dbe5;
      overflow-x: auto;
    }
    .toggle {
      height: 26px;
      min-width: 90px;
      padding: 0 9px;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: #fff;
      color: var(--g1);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .toggle input { vertical-align: -2px; }
    .toggle.c2 { color: var(--g2); }
    .toggle.c3 { color: var(--c3); }
    .toggle.purple { color: var(--purple); }
    .tablewrap { width: 100%; height: 100%; overflow: auto; background: #fff; }
    table { border-collapse: collapse; width: 100%; font: 14px Consolas, "Microsoft JhengHei", monospace; }
    th, td { border: 1px solid #d6dce4; padding: 5px 7px; white-space: nowrap; text-align: left; }
    th { background: #eef2f7; color: #35445a; position: sticky; top: 0; z-index: 2; }
    .chartbox { width: 100%; height: 100%; min-height: 0; position: relative; overflow: hidden; background: #fff; }
    canvas.chart { display: block; width: 100%; height: 100%; min-height: 0; background: #fff; }
    .single-layout { height: 100%; display: grid; grid-template-rows: 42px minmax(0, 1fr); }
    .single-ctrl {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px;
      background: #f0f3f8;
      border-bottom: 1px solid #d3dbe5;
    }
    .single-ctrl label { font-size: 14px; }
    #nudWaferNo { width: 80px; height: 28px; }
    #btnLoadWafer, #btnOpenSingle {
      height: 28px;
      border: 1px solid #aeb9c7;
      border-radius: 3px;
      background: #fff;
      cursor: pointer;
      padding: 0 12px;
    }
    #txtSingleFile {
      flex: 1;
      min-width: 160px;
      height: 28px;
      border: 1px solid #aeb9c7;
      padding: 3px 6px;
      background: #fff;
    }
    .subtabs { height: 100%; display: grid; grid-template-rows: 29px minmax(0, 1fr); }
    .subtabstrip { display: flex; align-items: end; padding: 5px 4px 0; border-bottom: 1px solid #aaa; background: #f4f4f4; }
    .subtab { width: 95px; height: 24px; border: 1px solid #aaa; border-bottom: 0; background: #ebebeb; cursor: pointer; }
    .subtab.active { background: #fff; font-weight: 800; }
    .subpage { display: none; min-height: 0; }
    .subpage.active { display: block; }
    .wear { height: 100%; display: grid; grid-template-rows: 28px minmax(0, 1fr); }
    .wearinfo { display: flex; align-items: center; padding-left: 6px; background: #f0f3f8; border-bottom: 1px solid #d3dbe5; font: 13px Consolas, monospace; }
    .ai { height: 100%; display: grid; grid-template-rows: 42px minmax(0, 1fr); }
    .ai textarea { width: 100%; height: 100%; border: 0; padding: 8px; resize: none; font-family: Consolas, "Microsoft JhengHei", monospace; }
    .ai input, .ai select { height: 28px; border: 1px solid #aeb9c7; padding: 3px 6px; }
    .hidden { display: none; }
    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; grid-template-rows: auto 24px minmax(520px, 1fr); }
      .topbar { height: 110px; }
      #btnWafer { left: 151px; }
      #btnPPT { left: 6px; top: 58px; }
      #btnLangZhTW { left: 151px; top: 66px; }
      #btnLangZhCN { left: 213px; top: 66px; }
      #btnLangEn { left: 275px; top: 66px; }
      #btnAbout { left: 337px; top: 66px; }
      #lblPath { left: 372px; right: 8px; top: 66px; }
      #lblVersion { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <button id="btnBatch" class="mainbtn">📁  批次分析</button>
      <button id="btnWafer" class="mainbtn">📄  單片 Wafer</button>
      <button id="btnPPT" class="mainbtn" disabled>📊  產出 PPT</button>
      <button id="btnLangZhTW" class="langbtn active">繁中</button>
      <button id="btnLangZhCN" class="langbtn">簡中</button>
      <button id="btnLangEn" class="langbtn">EN</button>
      <button id="btnAbout">?</button>
      <div id="lblPath">尚未載入</div>
      <div id="lblVersion">v1.7.2</div>
      <input id="folderInput" class="hidden" type="file" webkitdirectory directory multiple>
      <input id="singleFileInput" class="hidden" type="file" accept=".csv,.ini">
    </div>
    <div id="lblInfo" class="info">—</div>
    <div class="tabs">
      <div class="tabstrip" id="tabstrip">
        <button class="tab active" data-tab="params">加工參數</button>
        <button class="tab" data-tab="removal">移除量</button>
        <button class="tab" data-tab="postlift">抬針後移除量</button>
        <button class="tab" data-tab="loading">負載狀況</button>
        <button class="tab" data-tab="loaddist">負載分布</button>
        <button class="tab" data-tab="loadseq">負載時序串聯</button>
        <button class="tab" data-tab="loadpar">負載時序並聯</button>
        <button class="tab" data-tab="time">加工時間</button>
        <button class="tab" data-tab="wear">平均磨耗</button>
        <button class="tab" data-tab="thickness">成品厚度</button>
        <button class="tab" data-tab="single">單片分析</button>
        <button class="tab" data-tab="ai">優化建議</button>
      </div>

      <main>
        <section id="params" class="page active"><div class="tablewrap" id="dgvParams"></div></section>
        <section id="removal" class="page"><div class="split-v"><div class="chartbox"><canvas id="chtRemoval" class="chart"></canvas></div><div class="tablewrap" id="dgvRemovalStats"></div></div></section>
        <section id="postlift" class="page"><div class="chartbox"><canvas id="chtPostLift" class="chart"></canvas></div></section>
        <section id="loading" class="page">
          <div class="ctrlbar">
            <label class="toggle"><input id="chkLoadChuck1" type="checkbox" checked> Chuck 1</label>
            <label class="toggle c2"><input id="chkLoadChuck2" type="checkbox" checked> Chuck 2</label>
            <label class="toggle c3"><input id="chkLoadChuck3" type="checkbox" checked> Chuck 3</label>
            <label class="toggle purple"><input id="chkLoadOverall" type="checkbox"> G1 / G2 總覽</label>
          </div>
          <div class="split-half" style="height:calc(100% - 36px)"><div class="chartbox"><canvas id="chtLoadingG1" class="chart"></canvas></div><div class="chartbox"><canvas id="chtLoadingG2" class="chart"></canvas></div></div>
        </section>
        <section id="loaddist" class="page"><div class="chartbox"><canvas id="chtLoadingDist" class="chart"></canvas></div></section>
        <section id="loadseq" class="page"><div class="split-half"><div class="chartbox"><canvas id="chtLoadingSeqG1" class="chart"></canvas></div><div class="chartbox"><canvas id="chtLoadingSeqG2" class="chart"></canvas></div></div></section>
        <section id="loadpar" class="page">
          <div class="ctrlbar">
            <label class="toggle purple"><input id="chkParSmooth" type="checkbox"> 平滑化</label>
            <label class="toggle"><input class="chkPar" value="1" type="checkbox" checked> W1</label>
            <label class="toggle"><input class="chkPar" value="2" type="checkbox" checked> W2</label>
            <label class="toggle"><input class="chkPar" value="3" type="checkbox" checked> W3</label>
            <label class="toggle"><input class="chkPar" value="4" type="checkbox" checked> W4</label>
            <label class="toggle"><input class="chkPar" value="5" type="checkbox" checked> W5</label>
            <label class="toggle"><input class="chkPar" value="6" type="checkbox" checked> W6</label>
          </div>
          <div class="split-half" style="height:calc(100% - 36px)"><div class="chartbox"><canvas id="chtLoadingParG1" class="chart"></canvas></div><div class="chartbox"><canvas id="chtLoadingParG2" class="chart"></canvas></div></div>
        </section>
        <section id="time" class="page"><div class="chartbox"><canvas id="chtTime" class="chart"></canvas></div></section>
        <section id="wear" class="page"><div class="wear"><div id="lblWearInfo" class="wearinfo">—</div><div class="split-half"><div class="chartbox"><canvas id="chtWearG1Full" class="chart"></canvas></div><div class="chartbox"><canvas id="chtWearG2Full" class="chart"></canvas></div></div></div></section>
        <section id="thickness" class="page">
          <div class="ctrlbar">
            <label class="toggle"><input id="chkThickG1" type="checkbox" checked> G1 研磨後厚度</label>
            <label class="toggle c2"><input id="chkThickG2" type="checkbox" checked> G2 成品厚度</label>
          </div>
          <div class="chartbox" style="height:calc(100% - 36px)"><canvas id="chtThickness" class="chart"></canvas></div>
        </section>
        <section id="single" class="page">
          <div class="single-layout">
            <div class="single-ctrl">
              <label id="lblWaferNo" for="nudWaferNo">晶片號碼：</label>
              <input id="nudWaferNo" type="number" min="1" max="9999" value="1">
              <button id="btnLoadWafer">從批次載入</button>
              <label id="lblOrFile">或直接開啟：</label>
              <input id="txtSingleFile" readonly>
              <button id="btnOpenSingle">瀏覽...</button>
            </div>
            <div class="subtabs">
              <div class="subtabstrip"><button class="subtab active" data-sub="singleG1">G1  粗磨</button><button class="subtab" data-sub="singleG2">G2  細磨</button></div>
              <div id="singleG1" class="subpage active chartbox"><canvas id="chtSingleG1" class="chart"></canvas></div>
              <div id="singleG2" class="subpage chartbox"><canvas id="chtSingleG2" class="chart"></canvas></div>
            </div>
          </div>
        </section>
        <section id="ai" class="page">
          <div class="ai">
            <div class="ctrlbar">
              <label>AI 服務：</label><select id="cboProvider"><option>Google Gemini</option><option>Anthropic Claude</option><option>OpenRouter</option></select>
              <label>API Key：</label><input id="txtApiKey" type="password">
              <button id="btnSaveKey">儲存金鑰</button>
              <button id="btnClearKey">清除金鑰</button>
              <button id="btnGenAI">產生 AI 建議</button>
              <span id="lblAIStatus">就緒</span>
            </div>
            <textarea id="rtbAI"></textarea>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const state = { files: new Map(), info: null, records: [], waferCache: new Map(), folderName: "", seqLoaded: false, lang: "tw" };
    const $ = id => document.getElementById(id);
    const fmt = (v, d = 2) => Number.isFinite(v) ? Number(v.toFixed(d)).toString() : "-";
    const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
    const min = a => a.length ? Math.min(...a) : NaN;
    const max = a => a.length ? Math.max(...a) : NaN;
    const std = a => { if (a.length < 2) return 0; const m = avg(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    const tr = {
      tw: {
        btnBatch: "📁  批次分析", btnWafer: "📄  單片 Wafer", btnPPT: "📊  產出 PPT", notLoaded: "尚未載入",
        tabs: ["加工參數","移除量","抬針後移除量","負載狀況","負載分布","負載時序串聯","負載時序並聯","加工時間","平均磨耗","成品厚度","單片分析","優化建議"],
        waferNo: "晶片號碼：", singleG1: "G1  粗磨", singleG2: "G2  細磨", load: "從批次載入", browse: "瀏覽...", orOpen: "或直接開啟：",
        aiService: "AI 服務：", apiKey: "API Key：", saveKey: "儲存金鑰", genAI: "產生 AI 建議", ready: "就緒",
      },
      cn: {
        btnBatch: "📁  批量分析", btnWafer: "📄  单片 Wafer", btnPPT: "📊  产出 PPT", notLoaded: "尚未载入",
        tabs: ["加工参数","移除量","抬针后移除量","负载状况","负载分布","负载时序串联","负载时序并联","加工时间","平均磨耗","成品厚度","单片分析","优化建议"],
        waferNo: "晶片號碼：", singleG1: "G1  粗磨", singleG2: "G2  细磨", load: "从批次载入", browse: "浏览...", orOpen: "或直接开启：",
        aiService: "AI 服务：", apiKey: "API Key：", saveKey: "保存密钥", genAI: "产生 AI 建议", ready: "就绪",
      },
      en: {
        btnBatch: "📁  Batch", btnWafer: "📄  Single Wafer", btnPPT: "📊  Export PPT", notLoaded: "Not loaded",
        tabs: ["Parameters","Removal","Post-lift","Loading","Load Dist.","Load Sequence","Load Parallel","Proc. Time","Avg Wear Rate","Thickness","Single","AI Suggest"],
        waferNo: "Wafer No.:", singleG1: "G1 Rough", singleG2: "G2 Fine", load: "Load", browse: "Browse...", orOpen: "Or open:",
        aiService: "AI Service:", apiKey: "API Key:", saveKey: "Save Key", genAI: "Generate", ready: "Ready",
      }
    };

    function csvSplit(line) {
      const out = []; let cur = "", q = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; continue; }
        if (ch === '"') { q = !q; continue; }
        if (ch === "," && !q) { out.push(cur); cur = ""; continue; }
        cur += ch;
      }
      out.push(cur); return out;
    }
    const num = v => { const n = Number.parseFloat(String(v ?? "").trim()); return Number.isFinite(n) ? n : 0; };
    const int = v => { const n = Number.parseInt(String(v ?? "").trim(), 10); return Number.isFinite(n) ? n : 0; };
    function parseDate(v) { const s = String(v ?? "").trim(); if (!s || s === "0") return null; const d = new Date(s.replace(/\//g, "-")); return Number.isNaN(d.getTime()) ? null : d; }
    function parseTimeSeconds(s) { const m = String(s || "").trim().match(/^(\d{1,2}):(\d{2}):(\d{2})(?:\.(\d{1,3}))?$/); return m ? int(m[1]) * 3600 + int(m[2]) * 60 + int(m[3]) + int((m[4] || "0").padEnd(3, "0")) / 1000 : NaN; }
    async function readFileText(file) { const buf = await file.arrayBuffer(); try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/\r\n/g, "\n"); } catch { return new TextDecoder("big5").decode(buf).replace(/\r\n/g, "\n"); } }
    const fileKey = name => name.replace(/\\/g, "/").split("/").pop().toLowerCase();
    const findFile = name => state.files.get(name.toLowerCase()) || null;
    const findWaferFile = n => findFile(`w${String(n).padStart(4, "0")}.csv`) || findFile(`w${String(n).padStart(4, "0")}.ini`);
    const parts = v => String(v || "").split(",").map(x => x.trim());
    const at = (a, i) => (i >= 0 && i < a.length ? a[i] : "");
    const iniGet = (ini, sec, key) => (ini[sec] && ini[sec][key]) || "";
    function parseIni(text) { const ini = {}; let sec = ""; for (const raw of text.split("\n")) { const line = raw.trim(); if (!line || line.startsWith(";") || line.startsWith("#")) continue; const m = line.match(/^\[(.+)\]$/); if (m) { sec = m[1]; ini[sec] = ini[sec] || {}; continue; } const p = line.indexOf("="); if (p >= 0 && sec) ini[sec][line.slice(0, p).trim()] = line.slice(p + 1).trim(); } return ini; }

    function parseProcessCsv(text, fileCount = 0) {
      const lines = text.split("\n").map(x => x.trimEnd()); const idx = {}; lines.forEach((l, i) => { if (/^\[.+\]$/.test(l.trim())) idx[l.trim()] = i; });
      const info = { isValid: true };
      if (idx["[Info]"] >= 0) { const run = csvSplit(lines[idx["[Info]"] + 2] || ""); const mach = csvSplit(lines[idx["[Info]"] + 4] || ""); info.lotStartTime = parseDate(run[0]); info.lotEndTime = parseDate(run[1]); info.lotWaferAmount = int(run[3]); info.machineModel = mach[0] || ""; info.serialNumber = mach[1] || ""; info.lotID = mach[2] || ""; }
      if (idx["[WheelData]"] >= 0) { parseWheelRow(csvSplit(lines[idx["[WheelData]"] + 2] || ""), true, info); parseWheelRow(csvSplit(lines[idx["[WheelData]"] + 3] || ""), false, info); }
      info.g1PcsGrind ||= fileCount; info.g2PcsGrind ||= fileCount;
      if (idx["[Recipe]"] >= 0) { const r = csvSplit(lines[idx["[Recipe]"] + 2] || ""); info.recipeNumber = r[0] || ""; info.recipeName = r[1] || ""; }
      if (idx["[G1_Recipe]"] >= 0) parseRecipeCsv(lines, idx["[G1_Recipe]"], true, info);
      if (idx["[G2_Recipe]"] >= 0) parseRecipeCsv(lines, idx["[G2_Recipe]"], false, info);
      return info;
    }
    function parseWheelRow(cols, g1, info) { const p = g1 ? "g1" : "g2"; info[`${p}WheelID`] = cols[1] || ""; info[`${p}TotalWear`] = num(cols[4]); info[`${p}PcsOK`] = int(cols[5]); info[`${p}PcsNG`] = int(cols[6]); info[`${p}DressCount`] = int(cols[7]); info[`${p}AvgWear`] = num(cols[9]); info[`${p}PcsGrind`] = int(cols[10]); }

    function parseWaferCsvData(text, fileName) { const data = { fileName, waferNumber:int(fileKey(fileName).replace(/\D/g,"")), chuck:0, g1Result:"", g2Result:"", g1Steps:[], g2Steps:[] }; let section="", isG1=true, inStep=false, start=NaN, offset=0, prevEnd=0; for (const raw of text.split("\n")) { const line=raw.trimEnd(); if (!line.trim()) continue; if (/^\[.+\]$/.test(line.trim())) { section=line.trim(); inStep=false; start=NaN; offset=prevEnd; if (section.startsWith("[G1_Step")) isG1=true; if (section.startsWith("[G2_Step")) { if (isG1) prevEnd=0; isG1=false; offset=prevEnd; } continue; } const c=csvSplit(line); if (section==="[WaferInfo]") parseWaferInfoLine(c,data); if (section.startsWith("[G1_Step") || section.startsWith("[G2_Step")) { if (c[0]==="Time") { inStep=true; continue; } if (!inStep || c.length<=9) continue; const t=parseTimeSeconds(c[0]); if (!Number.isFinite(t)) continue; if (!Number.isFinite(start)) start=t; const rec=stepRecord(c,t-start+offset); prevEnd=rec.relativeSec; (isG1?data.g1Steps:data.g2Steps).push(rec); } } fixRelative(data.g1Steps); fixRelative(data.g2Steps); return data; }

    function parseWaferIniData(text, fileName) { const ini=parseIni(text); const data={fileName, waferNumber:int(fileKey(fileName).replace(/\D/g,"")), chuck:0, g1Steps:[], g2Steps:[]}; const block=parts(iniGet(ini,"BlockInfo","Data")); data.chuck=int(at(block,0)); data.g1Result=at(block,1)==="0"?"OK":"NG"; data.g2Result=at(block,2)==="0"?"OK":"NG"; data.waferNumber=int(at(parts(iniGet(ini,"BlockInfo","Cassette")),2))||data.waferNumber; fillWaferSummaryIni(ini,"G1",data); fillWaferSummaryIni(ini,"G2",data); fillWaferStepsIni(ini,"G1",data.g1Steps); fillWaferStepsIni(ini,"G2",data.g2Steps); fixRelative(data.g1Steps); fixRelative(data.g2Steps); return data; }
    function fillWaferSummaryIni(ini,g,data){const p=g.toLowerCase();const s0=parts(iniGet(ini,`${g}_Recipe`,"Step0"));const steps=int(at(s0,6));const before=parts(iniGet(ini,`${g}_Wheel`,"BeforeGrd"));const after=parts(iniGet(ini,`${g}_Wheel`,`AfterGrdStep${steps}`));data[`${p}TargetSV`]=num(at(s0,7));data[`${p}Income`]=num(at(before,12));data[`${p}LastWaferMin`]=num(at(before,11));data[`${p}TargetPV`]=num(at(after,11));}
    function fillWaferStepsIni(ini,g,out){const steps=int(at(parts(iniGet(ini,`${g}_Recipe`,"Step0")),6));let prevEnd=0;for(let step=1;step<=steps;step++){const sec=ini[`${g}_Step${step}`];if(!sec)continue;const count=int(sec["0"]);let start=NaN;const offset=prevEnd;for(let k=1;k<=count;k++){const row=sec[String(k)];if(!row)continue;const c=csvSplit(row);const t=parseTimeSeconds(c[0]);if(!Number.isFinite(t))continue;if(!Number.isFinite(start))start=t;const rec=stepRecord(c,t-start+offset);prevEnd=rec.relativeSec;out.push(rec);}}}

    function saveApiKey(){const value=$("txtApiKey").value.trim(),t=aiKeyText();if(!value){$("lblAIStatus").textContent=t.empty;return;}try{localStorage.setItem(aiKeyStorageKey(),value);$("lblAIStatus").textContent=t.saved;}catch{$("lblAIStatus").textContent=t.empty;}}
    function clearApiKey(){try{localStorage.removeItem(aiKeyStorageKey());}catch{}$("txtApiKey").value="";$("lblAIStatus").textContent=aiKeyText().cleared;}
    function applyLanguage(lang){state.lang=lang;const t=tr[lang],l=L();$("btnBatch").textContent=t.btnBatch;$("btnWafer").textContent=t.btnWafer;$("btnPPT").textContent=t.btnPPT;document.querySelectorAll(".langbtn").forEach(b=>b.classList.remove("active"));$(`btnLang${lang==="tw"?"ZhTW":lang==="cn"?"ZhCN":"En"}`).classList.add("active");document.querySelectorAll(".tab").forEach((b,i)=>b.textContent=t.tabs[i]);document.querySelector('[data-sub="singleG1"]').textContent=t.singleG1;document.querySelector('[data-sub="singleG2"]').textContent=t.singleG2;$("lblWaferNo").textContent=l.waferNo;$("lblOrFile").textContent=l.orOpen;$("btnLoadWafer").textContent=l.load;$("btnOpenSingle").textContent=l.browse;$("btnSaveKey").textContent=t.saveKey;$("btnGenAI").textContent=t.genAI;$("btnClearKey").textContent=aiKeyText().clear;$("lblAIStatus").textContent=loadStoredApiKey()?aiKeyText().saved:t.ready;if(!$("lblPath").textContent||["尚未載入","尚未载入","Not loaded"].includes($("lblPath").textContent))$("lblPath").textContent=l.notLoaded;setStaticLanguage();renderAll();renderSeq();renderPar();}
    function aiStatusText(){return state.lang==="en"?{noData:"Load batch data first",noKey:"Enter and save an API key first",calling:"Calling AI...",done:"Done",failed:"Failed"}:state.lang==="cn"?{noData:"请先载入批次资料",noKey:"请先输入并保存 API Key",calling:"正在呼叫 AI...",done:"完成",failed:"失败"}:{noData:"請先載入批次資料",noKey:"請先輸入並儲存 API Key",calling:"正在呼叫 AI...",done:"完成",failed:"失敗"};}
    function aiProviderName(){return $("cboProvider").value||$("cboProvider").selectedOptions?.[0]?.textContent||"";}
    function buildAIPrompt(){const g1=okSeries("G1","g1Removal").map(p=>p.y),g2=okSeries("G2","g2Removal").map(p=>p.y),g1Wear=wearSeriesData("g1"),g2Wear=wearSeriesData("g2"),i=state.info||{};const load=loadingDistGroups().map(g=>`${g.band||""} ${g.label}: n=${g.values.length}, avg=${fmt(avg(g.values),1)}, max=${fmt(max(g.values),1)}, min=${fmt(min(g.values),1)}`).join("\n");return `你是 FSG2300 研磨製程分析助手。請用繁體中文提供可執行的優化建議，重點放在移除量穩定性、S1 Loading、磨耗率、加工時間與異常風險。請用條列式輸出：1. 主要觀察 2. 可能原因 3. 建議調整 4. 需要再確認的資料。\n\n批次摘要\nMachine: ${i.machineModel||""}\nRecipe: ${i.recipeNumber||""} ${i.recipeName||""}\nWafers: ${state.records.length}\nUPH: ${fmt(i.g1UPH>0?i.g1UPH:batchUph(),1)}\nG1 Removal Avg/Std/Max/Min: ${fmt(avg(g1))} / ${fmt(std(g1))} / ${fmt(max(g1))} / ${fmt(min(g1))} um\nG2 Removal Avg/Std/Max/Min: ${fmt(avg(g2))} / ${fmt(std(g2))} / ${fmt(max(g2))} / ${fmt(min(g2))} um\nG1 NG: ${state.records.filter(r=>r.g1Result&&!r.g1OK).length}\nG2 NG: ${state.records.filter(r=>r.g2Result&&!r.g2OK).length}\nG1 Wear Rate: ${fmt(g1Wear.average,5)}\nG2 Wear Rate: ${fmt(g2Wear.average,5)}\n\nS1 Loading by Chuck\n${load}`;}
    function renderAISeed(){const prompt=buildAIPrompt();$("rtbAI").value=`批次摘要已產生。\n\n${prompt}\n\n請輸入 API Key 後按「產生 AI 建議」，系統會直接呼叫選取的 AI 服務。`;return prompt;}
    async function fetchJson(url,options){const res=await fetch(url,options),txt=await res.text();let data={};try{data=txt?JSON.parse(txt):{};}catch{data={raw:txt};}if(!res.ok)throw new Error(data.error?.message||data.error?.error?.message||data.message||txt||`HTTP ${res.status}`);return data;}
    async function callGeminiAI(key,prompt){const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${encodeURIComponent(key)}`;const data=await fetchJson(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});return (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("\n").trim();}
    async function callClaudeAI(key,prompt){const data=await fetchJson("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:2048,messages:[{role:"user",content:prompt}]})});return (data.content||[]).map(p=>p.text||"").join("\n").trim();}
    async function callOpenRouterAI(key,prompt){const data=await fetchJson("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${key}`},body:JSON.stringify({model:"google/gemini-2.5-flash",messages:[{role:"user",content:prompt}]})});return (data.choices?.[0]?.message?.content||"").trim();}
    async function generateAIRecommendation(){const t=aiStatusText();if(!state.records.length){$("lblAIStatus").textContent=t.noData;return;}const key=($("txtApiKey").value||loadStoredApiKey()).trim();if(!key){renderAISeed();$("lblAIStatus").textContent=t.noKey;return;}saveAIProvider();try{localStorage.setItem(aiKeyStorageKey(),key);}catch{}const prompt=buildAIPrompt(),provider=aiProviderName();$("lblAIStatus").textContent=t.calling;$("btnGenAI").disabled=true;$("rtbAI").value=`${t.calling}\n${provider}`;try{let text="";if(/Gemini/i.test(provider))text=await callGeminiAI(key,prompt);else if(/Anthropic|Claude/i.test(provider))text=await callClaudeAI(key,prompt);else text=await callOpenRouterAI(key,prompt);$("rtbAI").value=text||"(AI 沒有回傳內容)";$("lblAIStatus").textContent=t.done;}catch(err){$("rtbAI").value=`${t.failed}: ${err.message||String(err)}\n\n如果是 Claude，瀏覽器直連有時仍會被 CORS 或帳號權限擋住；可改用 OpenRouter 或 Gemini。\n\n--- 原始摘要 ---\n${prompt}`;$("lblAIStatus").textContent=t.failed;}finally{$("btnGenAI").disabled=false;}}

    $("btnBatch").addEventListener("click", ()=>$("folderInput").click());
    $("btnWafer").addEventListener("click", ()=>$("singleFileInput").click());
    $("btnPPT").addEventListener("click", exportPptx);
    $("btnAbout").addEventListener("click", ()=>alert("FSG2300 Log Analysis Web\\nCSV / INI batch analysis and single wafer charting."));
    $("folderInput").addEventListener("change", async e=>{try{$("lblPath").textContent="Loading...";await loadBatchFromFiles([...e.target.files]);}catch(err){alert(err.message||String(err));$("lblPath").textContent=tr[state.lang].notLoaded;}});
    $("singleFileInput").addEventListener("change", e=>loadSingleWafer(e.target.files[0]).catch(err=>alert(err.message||String(err))));
    $("btnOpenSingle").addEventListener("click", ()=>$("singleFileInput").click());
    $("btnLoadWafer").addEventListener("click", ()=>loadWaferFromBatch().catch(err=>alert(err.message||String(err))));
    document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>activateTab(b.dataset.tab)));
    document.querySelectorAll(".subtab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".subtab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".subpage").forEach(p=>p.classList.toggle("active",p.id===b.dataset.sub));}));
    ["chkLoadChuck1","chkLoadChuck2","chkLoadChuck3","chkLoadOverall","chkThickG1","chkThickG2"].forEach(id=>$(id).addEventListener("change",renderAll));
    document.querySelectorAll(".chkPar").forEach(x=>x.addEventListener("change",renderPar));
    $("chkParSmooth").addEventListener("change",renderPar);
    $("btnLangZhTW").addEventListener("click",()=>applyLanguage("tw"));
    $("btnLangZhCN").addEventListener("click",()=>applyLanguage("cn"));
    $("btnLangEn").addEventListener("click",()=>applyLanguage("en"));
    $("cboProvider").addEventListener("change",providerChanged);
    $("btnSaveKey").addEventListener("click",saveApiKey);
    $("btnClearKey").addEventListener("click",clearApiKey);
    $("btnGenAI").addEventListener("click",generateAIRecommendation);
    restoreAIProvider();
    restoreApiKey();
    window.addEventListener("resize",()=>{renderAll();renderSeq();renderPar();});
  </script>
</body>
</html>
